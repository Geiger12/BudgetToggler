<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Tracker</title>
<meta name="description" content="Track which bills you have paid, and when.">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16160f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg:#f6f5f1; --card:#ffffff; --fg:#1f1e1b; --muted:#6b6a65; --line:#e5e3dc; --accent:#2f6f5e; --accent-soft:#e3f0ec;
  --bad:#b3261e; --bad-soft:#fbe9e7; --warn:#9a5700; --warn-soft:#fdf0d9; --ok:#1f7a4d; --track:#e9e7e0;
  color-scheme: light;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#16160f; --card:#211f1b; --fg:#f1efe8; --muted:#a3a198; --line:#34322c; --accent:#6cc3a8; --accent-soft:#1d332d;
    --bad:#ff8a80; --bad-soft:#3a1f1c; --warn:#f2b45c; --warn-soft:#3a2d14; --ok:#7bd6a1; --track:#34322c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#16160f; --card:#211f1b; --fg:#f1efe8; --muted:#a3a198; --line:#34322c; --accent:#6cc3a8; --accent-soft:#1d332d;
  --bad:#ff8a80; --bad-soft:#3a1f1c; --warn:#f2b45c; --warn-soft:#3a2d14; --ok:#7bd6a1; --track:#34322c; color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 14px; }
.top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.nav { display:flex; align-items:center; gap:6px; }
.nav .month { min-width: 128px; text-align:center; font-weight:600; font-size:17px; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { border:1px solid var(--line); background:var(--card); border-radius:10px; padding:7px 12px; min-height:38px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
:root[data-theme="dark"] .btn.primary, :root:not([data-theme="light"]) .btn.primary { color:#10201b; }
.btn.small { padding:3px 10px; min-height:30px; font-size:13px; }
.btn.danger { color: var(--bad); }
.btn:focus-visible, .sw:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.banner { margin:14px 0 0; padding:10px 14px; border-radius:10px; background:var(--warn-soft); color:var(--warn); font-size:14px; }
.stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin:18px 0 8px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
.stat .l { color:var(--muted); font-size:13px; }
.stat .v { font-size:22px; font-weight:650; font-variant-numeric:tabular-nums; margin-top:2px; }
.stat .s { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
.bar { height:8px; background:var(--track); border-radius:99px; overflow:hidden; margin-top:8px; }
.bar > i { display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .25s ease; }
.bar.over > i { background:var(--bad); }
section.group { margin-top:22px; }
section.group h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; display:flex; justify-content:space-between; }
.list { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.row { padding:12px 14px; border-top:1px solid var(--line); }
.row:first-child { border-top:0; }
.line { display:flex; align-items:center; gap:12px; }
.sw { flex:none; width:46px; height:28px; border-radius:99px; border:0; background:var(--track); position:relative; padding:0; transition:background .15s; }
.sw::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .15s; }
.sw[aria-checked="true"] { background:var(--accent); }
.sw[aria-checked="true"]::after { transform:translateX(18px); }
.main { flex:1; min-width:0; }
.name { font-weight:600; overflow-wrap:anywhere; }
.row.paid .name { color:var(--muted); text-decoration: line-through; text-decoration-thickness:1px; }
.meta { color:var(--muted); font-size:13px; display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
.tag { font-size:12px; padding:1px 8px; border-radius:99px; background:var(--track); color:var(--muted); }
.tag.bad { background:var(--bad-soft); color:var(--bad); }
.tag.warn { background:var(--warn-soft); color:var(--warn); }
.tag.ok { background:var(--accent-soft); color:var(--ok); }
.amt { font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
.amt.in { color:var(--ok); }
.detail { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin:10px 0 0 58px; font-size:13px; color:var(--muted); }
.detail label { display:flex; align-items:center; gap:6px; }
input, select { font:inherit; font-size:14px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:5px 8px; min-height:34px; }
input[type=number] { width: 104px; }
input.day { width: 64px; }
.controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0 0 58px; font-size:13px; color:var(--muted); }
.panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:16px; }
.panel h3 { margin:0 0 10px; font-size:16px; }
.fields { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
.fields label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
.fields input, .fields select { width:100%; }
.actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.empty { padding:28px 16px; text-align:center; color:var(--muted); }
.foot { display:flex; gap:8px; flex-wrap:wrap; margin-top:26px; }
.vrow .vline { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.vrow .main { min-width:150px; }
.vrow .spent { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
@media (max-width:480px) { .detail, .controls { margin-left:0; } }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Budget Tracker</h1>
      <p class="sub">Switch an item on when you’ve paid it. The date is filled in for you and you can change it.</p>
    </div>
    <div class="nav" role="group" aria-label="Choose month">
      <button class="btn" id="prev" aria-label="Previous month">‹</button>
      <div class="month" id="monthLabel" aria-live="polite"></div>
      <button class="btn" id="next" aria-label="Next month">›</button>
      <button class="btn" id="today">Today</button>
    </div>
  </div>
  <div id="banner"></div>
  <div class="stats" id="stats"></div>
  <div id="lists"></div>
  <div id="addHost"></div>
  <div class="foot">
    <button class="btn" id="addBtn">+ Add item</button>
    <button class="btn" id="manageBtn">Edit items</button>
    <button class="btn" id="backupBtn">Back up</button>
    <button class="btn" id="restoreBtn">Restore</button>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden>
  </div>
  <p class="sub" style="margin-top:14px">Your budget is saved on this device only. Use Back up now and then, and Restore to move it to a new phone.</p>
</div>

<script>
(function () {
  "use strict";
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const pad = (n) => String(n).padStart(2, "0");
  const isoOf = (y, m, d) => y + "-" + pad(m + 1) + "-" + pad(d);           // m is 0-based
  const todayISO = () => { const t = new Date(); return isoOf(t.getFullYear(), t.getMonth(), t.getDate()); };
  const dayNum = (y, m, d) => Math.round(Date.UTC(y, m, d) / 864e5);
  const fromDayNum = (n) => { const t = new Date(n * 864e5); return { y: t.getUTCFullYear(), m: t.getUTCMonth(), d: t.getUTCDate() }; };
  const daysIn = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return { y, m: m - 1, d }; };
  const niceDate = (iso) => { const p = parseISO(iso); const w = new Date(Date.UTC(p.y, p.m, p.d)).getUTCDay(); return DOW[w] + ", " + MONTHS[p.m].slice(0, 3) + " " + p.d; };
  const fmt = (v) => { const n = Math.abs(v); const s = Number.isInteger(+n.toFixed(2)) ? n.toLocaleString("en-CA", { maximumFractionDigits: 0 }) : n.toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (v < 0 ? "−$" : "$") + s; };

  const state = { items: [], pay: new Map(), y: new Date().getFullYear(), m: new Date().getMonth(), manage: false, adding: false, ready: true, mode: "saved", note: "" };
  let itemsCol = null, payCol = null;

  /* ---------- storage: this device's localStorage ---------- */
  const KEY = "budget-tracker:v1";
  const TYPES = ["income", "bill", "variable"];
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      state.items = Array.isArray(d.items) ? d.items : [];
      state.pay = new Map(Object.entries(d.pay || {}));
    } catch (e) { state.mode = "local"; }
  }
  function persist() {
    if (state.mode === "local") return;
    try { localStorage.setItem(KEY, JSON.stringify({ version: 1, items: state.items, pay: Object.fromEntries(state.pay) })); }
    catch (e) { state.mode = "local"; }
  }
  const upsert = (arr, it) => { const i = arr.findIndex((x) => x.id === it.id); if (i >= 0) arr[i] = it; else arr.push(it); };
  const store = {
    setItem(it) { upsert(state.items, it); persist(); render(); },
    delItem(id) { state.items = state.items.filter((x) => x.id !== id); for (const [k, v] of Array.from(state.pay)) if (v.item === id) state.pay.delete(k); persist(); render(); },
    setPay(key, p) { state.pay.set(key, p); persist(); render(); },
    delPay(key) { state.pay.delete(key); persist(); render(); }
  };

  /* ---------- backup and restore ---------- */
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
  const str = (v, max) => (typeof v === "string" ? v.slice(0, max) : "");
  function cleanItem(x) {
    if (!x || typeof x.id !== "string" || !x.id || !TYPES.includes(x.type) || num(x.amount) == null || x.amount < 0) return null;
    const it = { id: str(x.id, 80), name: str(x.name, 60) || "Untitled", type: x.type, amount: x.amount, account: str(x.account, 40), order: num(x.order) || 0, freq: x.freq === "biweekly" ? "biweekly" : "monthly" };
    if (it.freq === "biweekly") { if (!/^\d{4}-\d{2}-\d{2}$/.test(x.anchor || "")) return null; it.anchor = x.anchor; }
    else if (it.type !== "variable") it.day = Math.min(31, Math.max(1, Math.round(num(x.day) || 1)));
    return it;
  }
  async function backup() {
    const data = JSON.stringify({ app: "budget-tracker", version: 1, items: state.items, pay: Object.fromEntries(state.pay) }, null, 2);
    const name = "budget-backup-" + todayISO() + ".json";
    const file = new File([data], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "Budget backup" }); return; } catch (e) { if (e && e.name === "AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  async function restore(file) {
    try {
      const d = JSON.parse(await file.text());
      const items = (Array.isArray(d.items) ? d.items : []).map(cleanItem).filter(Boolean);
      if (!items.length) throw new Error("no items");
      const pay = new Map();
      for (const [k, v] of Object.entries(d.pay || {})) {
        if (v && typeof v.item === "string" && items.some((i) => i.id === v.item)) pay.set(String(k).slice(0, 120), { item: v.item, due: /^\d{4}-\d{2}-\d{2}$/.test(v.due || "") ? v.due : null, on: /^\d{4}-\d{2}-\d{2}$/.test(v.on || "") ? v.on : todayISO(), amt: num(v.amt) ?? 0 });
      }
      if (state.items.length && !window.confirm("Replace the budget on this device with the one in this file?")) return;
      state.items = items; state.pay = pay; state.note = "Restored " + items.length + " items."; persist(); render();
    } catch (e) { state.note = "That file couldn’t be read as a budget backup."; render(); }
  }
  function loadSample() {
    const t = new Date(); const back = (t.getDay() + 2) % 7;         // most recent Friday
    const f = new Date(t.getFullYear(), t.getMonth(), t.getDate() - back);
    const s = [
      { id: "sample-pay", name: "Paycheck", type: "income", amount: 2000, freq: "biweekly", anchor: isoOf(f.getFullYear(), f.getMonth(), f.getDate()), account: "Chequing", order: 1 },
      { id: "sample-rent", name: "Rent", type: "bill", amount: 1200, freq: "monthly", day: 1, account: "E-Transfer", order: 2 },
      { id: "sample-internet", name: "Internet", type: "bill", amount: 70, freq: "monthly", day: 12, account: "Visa", order: 3 },
      { id: "sample-phone", name: "Phone", type: "bill", amount: 60, freq: "monthly", day: 15, account: "Visa", order: 4 },
      { id: "sample-groceries", name: "Groceries", type: "variable", amount: 500, freq: "monthly", account: "Chequing", order: 5 }
    ];
    state.items = s; persist(); render();
  }

  /* ---------- schedule ---------- */
  function occurrences(item, y, m) {
    const out = [];
    if (item.type === "variable") { out.push({ item, due: null, key: item.id + "_" + y + "-" + pad(m + 1) }); return out; }
    if (item.freq === "biweekly" && item.anchor) {
      const a = parseISO(item.anchor), aN = dayNum(a.y, a.m, a.d);
      const first = dayNum(y, m, 1), last = dayNum(y, m, daysIn(y, m));
      let n = Math.ceil((first - aN) / 14);
      for (let d = aN + n * 14; d <= last; d += 14) { const p = fromDayNum(d); const due = isoOf(p.y, p.m, p.d); out.push({ item, due, key: item.id + "_" + due }); }
      return out;
    }
    const day = Math.min(Math.max(1, Math.round(item.day || 1)), daysIn(y, m));
    const due = isoOf(y, m, day);
    out.push({ item, due, key: item.id + "_" + due });
    return out;
  }
  const daysUntil = (iso) => dayNum(...Object.values(parseISO(iso))) - dayNum(...Object.values(parseISO(todayISO())));

  /* ---------- tiny DOM helper (text only, never innerHTML) ---------- */
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === false || v == null) continue;
      if (k === "class") e.className = v;
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, "");
      else e.setAttribute(k, v);
    }
    for (const k of kids.flat()) { if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(k)); }
    return e;
  }

  /* ---------- render ---------- */
  function render() {
    const { y, m } = state;
    document.getElementById("monthLabel").textContent = MONTHS[m] + " " + y;
    const banner = document.getElementById("banner"); banner.replaceChildren();
    if (state.mode === "local") banner.append(h("div", { class: "banner" }, "This browser isn’t letting the page save, so your progress will reset when you close it."));
    else if (state.note) banner.append(h("div", { class: "banner" }, state.note));

    const incomes = [], bills = [], vars = [];
    for (const it of state.items.slice().sort((a, b) => (a.order || 0) - (b.order || 0))) {
      for (const o of occurrences(it, y, m)) (it.type === "income" ? incomes : it.type === "variable" ? vars : bills).push(o);
    }
    const byDue = (a, b) => (a.due || "").localeCompare(b.due || "") || (a.item.order || 0) - (b.item.order || 0);
    incomes.sort(byDue); bills.sort(byDue);

    // totals
    const paidAmt = (o) => (state.pay.get(o.key) || {}).amt;
    const isPaid = (o) => state.pay.has(o.key);
    const expIn = incomes.reduce((s, o) => s + o.item.amount, 0);
    const gotIn = incomes.reduce((s, o) => s + (isPaid(o) ? paidAmt(o) ?? o.item.amount : 0), 0);
    const billsPaidCount = bills.filter(isPaid).length;
    const billsPaidAmt = bills.reduce((s, o) => s + (isPaid(o) ? paidAmt(o) ?? o.item.amount : 0), 0);
    const toPay = bills.filter((o) => !isPaid(o)).reduce((s, o) => s + o.item.amount, 0);
    const overdue = bills.filter((o) => !isPaid(o) && o.due < todayISO()).length;
    const varSpent = vars.reduce((s, o) => s + (paidAmt(o) || 0), 0);
    const varBudget = vars.reduce((s, o) => s + o.item.amount, 0);

    const stats = document.getElementById("stats"); stats.replaceChildren(
      stat("Income received", fmt(gotIn), "of " + fmt(expIn) + " expected", expIn ? gotIn / expIn : 0),
      stat("Bills paid", fmt(billsPaidAmt), billsPaidCount + " of " + bills.length + " bills", bills.length ? billsPaidCount / bills.length : 0),
      stat("Still to pay", fmt(toPay), overdue ? overdue + " overdue" : "Nothing overdue", null),
      stat("Everyday spending", fmt(varSpent), "of " + fmt(varBudget) + " budget", varBudget ? varSpent / varBudget : 0, varSpent > varBudget)
    );

    const lists = document.getElementById("lists"); lists.replaceChildren();
    if (!state.ready) { lists.append(h("div", { class: "empty" }, "Loading your budget…")); return; }
    if (!state.items.length) { lists.append(h("div", { class: "panel empty" }, h("p", {}, "Nothing here yet. Add your first paycheck or bill, restore a backup, or try a sample budget."), h("div", { class: "actions", style: "justify-content:center" }, h("button", { class: "btn primary", onclick: () => { state.adding = true; render(); } }, "Add an item"), h("button", { class: "btn", onclick: () => document.getElementById("restoreFile").click() }, "Restore a backup"), h("button", { class: "btn", onclick: loadSample }, "Load a sample budget")))); }
    if (incomes.length) lists.append(group("Money in", incomes.map(row)));
    if (bills.length) lists.append(group("Bills", bills.map(row), billsPaidCount + " of " + bills.length + " paid"));
    if (vars.length) lists.append(group("Everyday spending", vars.map(vrow), "Enter what you’ve spent so far"));
    renderAdd();
    document.getElementById("manageBtn").textContent = state.manage ? "Done editing" : "Edit items";
  }

  function stat(label, value, sub, frac, over) {
    return h("div", { class: "stat" }, h("div", { class: "l" }, label), h("div", { class: "v" }, value), h("div", { class: "s" }, sub),
      frac == null ? null : h("div", { class: "bar" + (over ? " over" : "") }, h("i", { style: "width:" + Math.min(100, Math.round(frac * 100)) + "%" })));
  }
  function group(title, rows, right) {
    return h("section", { class: "group" }, h("h2", {}, h("span", {}, title), right ? h("span", {}, right) : null), h("div", { class: "list" }, rows));
  }

  function row(o) {
    const it = o.item, p = state.pay.get(o.key), paid = !!p;
    const d = daysUntil(o.due);
    let tag = null;
    if (paid) tag = h("span", { class: "tag ok" }, it.type === "income" ? "Received" : "Paid");
    else if (d < 0) tag = h("span", { class: "tag bad" }, it.type === "income" ? "Not received yet" : "Overdue");
    else if (d === 0) tag = h("span", { class: "tag warn" }, "Due today");
    else if (d <= 3) tag = h("span", { class: "tag warn" }, "Due in " + d + (d === 1 ? " day" : " days"));
    const sw = h("button", {
      class: "sw", role: "switch", "aria-checked": String(paid),
      "aria-label": (it.type === "income" ? "Mark received: " : "Mark paid: ") + it.name + ", " + niceDate(o.due),
      onclick: () => paid ? store.delPay(o.key) : store.setPay(o.key, { item: it.id, due: o.due, on: todayISO(), amt: it.amount })
    });
    const amtShown = paid && p.amt != null ? p.amt : it.amount;
    const r = h("div", { class: "row" + (paid ? " paid" : "") },
      h("div", { class: "line" }, sw,
        h("div", { class: "main" }, h("div", { class: "name" }, it.name), h("div", { class: "meta" }, h("span", {}, niceDate(o.due) + (it.account ? " · " + it.account : "")), tag)),
        h("div", { class: "amt" + (it.type === "income" ? " in" : "") }, (it.type === "income" ? "+" : "") + fmt(amtShown))));
    if (paid) r.append(h("div", { class: "detail" },
      h("label", {}, it.type === "income" ? "Received on" : "Paid on", h("input", { type: "date", value: p.on || todayISO(), "aria-label": "Date " + it.name + " was paid",
        onchange: (e) => { if (e.target.value) store.setPay(o.key, { ...p, on: e.target.value }); } })),
      h("label", {}, "Amount", h("input", { type: "number", step: "0.01", min: "0", value: String(p.amt ?? it.amount), "aria-label": "Amount actually paid for " + it.name,
        onchange: (e) => { const v = parseFloat(e.target.value); if (!isNaN(v) && v >= 0) store.setPay(o.key, { ...p, amt: v }); } }))));
    if (state.manage) r.append(manageControls(it));
    return r;
  }

  function vrow(o) {
    const it = o.item, p = state.pay.get(o.key), spent = p ? p.amt || 0 : 0, over = spent > it.amount;
    const r = h("div", { class: "row vrow" },
      h("div", { class: "vline" },
        h("div", { class: "main" }, h("div", { class: "name" }, it.name), h("div", { class: "meta" }, "Budget " + fmt(it.amount) + (over ? "" : " · " + fmt(it.amount - spent) + " left"), over ? h("span", { class: "tag bad" }, fmt(spent - it.amount) + " over") : null)),
        h("div", { class: "spent" }, "Spent $", h("input", { type: "number", step: "0.01", min: "0", value: spent ? String(spent) : "", placeholder: "0", "aria-label": "Amount spent on " + it.name,
          onchange: (e) => { const v = parseFloat(e.target.value); if (!v || v <= 0) store.delPay(o.key); else store.setPay(o.key, { item: it.id, due: null, on: (p && p.on) || todayISO(), amt: v }); } }))),
      h("div", { class: "bar" + (over ? " over" : ""), role: "img", "aria-label": fmt(spent) + " of " + fmt(it.amount) + " spent" }, h("i", { style: "width:" + Math.min(100, Math.round((it.amount ? spent / it.amount : 0) * 100)) + "%" })));
    if (state.manage) r.append(manageControls(it));
    return r;
  }

  function manageControls(it) {
    let armed = false;
    const rm = h("button", { class: "btn small danger", onclick: () => { if (!armed) { armed = true; rm.textContent = "Tap again to remove"; return; } store.delItem(it.id); } }, "Remove");
    return h("div", { class: "controls" },
      h("label", {}, "Amount $", h("input", { type: "number", step: "0.01", min: "0", value: String(it.amount), onchange: (e) => { const v = parseFloat(e.target.value); if (!isNaN(v) && v >= 0) store.setItem({ ...it, amount: v }); } })),
      it.type !== "variable" && it.freq !== "biweekly" ? h("label", {}, "Due day", h("input", { class: "day", type: "number", min: "1", max: "31", value: String(it.day || 1), onchange: (e) => { const v = parseInt(e.target.value, 10); if (v >= 1 && v <= 31) store.setItem({ ...it, day: v }); } })) : null,
      rm);
  }

  /* ---------- add item ---------- */
  function renderAdd() {
    const host = document.getElementById("addHost"); host.replaceChildren();
    if (!state.adding) return;
    const f = {};
    const field = (label, el) => h("label", {}, label, el);
    f.name = h("input", { type: "text", placeholder: "e.g. Gym", maxlength: "60" });
    f.type = h("select", {}, h("option", { value: "bill" }, "Bill"), h("option", { value: "income" }, "Money in"), h("option", { value: "variable" }, "Everyday spending"));
    f.amount = h("input", { type: "number", step: "0.01", min: "0", placeholder: "0.00" });
    f.freq = h("select", {}, h("option", { value: "monthly" }, "Every month"), h("option", { value: "biweekly" }, "Every 2 weeks"));
    f.day = h("input", { type: "number", min: "1", max: "31", placeholder: "1–31" });
    f.anchor = h("input", { type: "date", value: todayISO() });
    f.account = h("input", { type: "text", placeholder: "Optional", maxlength: "40" });
    const dayF = field("Due day of month", f.day), freqF = field("How often", f.freq), anchorF = field("First date", f.anchor);
    const sync = () => {
      const v = f.type.value === "variable", bi = f.freq.value === "biweekly" && !v;
      freqF.hidden = v; dayF.hidden = v || bi; anchorF.hidden = !bi;
    };
    f.type.addEventListener("change", sync); f.freq.addEventListener("change", sync);
    const err = h("div", { class: "sub", role: "alert" });
    const save = h("button", { class: "btn primary", onclick: () => {
      const name = f.name.value.trim(), amount = parseFloat(f.amount.value), type = f.type.value;
      if (!name) { err.textContent = "Please enter a name."; return; }
      if (isNaN(amount) || amount < 0) { err.textContent = "Please enter an amount."; return; }
      const it = { id: name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) + "-" + Date.now().toString(36), name, type, amount, account: f.account.value.trim(), order: Math.max(0, ...state.items.map((x) => x.order || 0)) + 1 };
      if (type === "variable") { it.freq = "monthly"; }
      else if (f.freq.value === "biweekly") { if (!f.anchor.value) { err.textContent = "Please pick the first date."; return; } it.freq = "biweekly"; it.anchor = f.anchor.value; }
      else { const d = parseInt(f.day.value, 10); if (!(d >= 1 && d <= 31)) { err.textContent = "Please enter a due day from 1 to 31."; return; } it.freq = "monthly"; it.day = d; }
      store.setItem(it); state.adding = false; render();
    } }, "Save item");
    host.append(h("div", { class: "panel" }, h("h3", {}, "Add an item"),
      h("div", { class: "fields" }, field("Name", f.name), field("Type", f.type), field("Amount ($)", f.amount), freqF, dayF, anchorF, field("Account", f.account)),
      err, h("div", { class: "actions" }, save, h("button", { class: "btn", onclick: () => { state.adding = false; render(); } }, "Cancel"))));
    sync();
  }

  /* ---------- controls ---------- */
  const step = (n) => { let m = state.m + n, y = state.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } state.m = m; state.y = y; render(); };
  document.getElementById("prev").addEventListener("click", () => step(-1));
  document.getElementById("next").addEventListener("click", () => step(1));
  document.getElementById("today").addEventListener("click", () => { const t = new Date(); state.y = t.getFullYear(); state.m = t.getMonth(); render(); });
  document.getElementById("addBtn").addEventListener("click", () => { state.adding = !state.adding; render(); if (state.adding) document.getElementById("addHost").scrollIntoView({ block: "nearest" }); });
  document.getElementById("manageBtn").addEventListener("click", () => { state.manage = !state.manage; render(); });

  document.getElementById("backupBtn").addEventListener("click", backup);
  document.getElementById("restoreBtn").addEventListener("click", () => document.getElementById("restoreFile").click());
  document.getElementById("restoreFile").addEventListener("change", (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) restore(f); });

  /* ---------- start ---------- */
  load();
  render();
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
